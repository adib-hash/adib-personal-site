<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stack</title>
<meta name="description" content="Tap to drop the sliding block. Line it up to build higher.">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
  :root {
    --surface-0: #f7f7f5;
    --surface-1: #eeede9;
    --text-primary: #1f1f1d;
    --text-secondary: #6b6a65;
    --border-strong: rgba(0, 0, 0, 0.2);
    --hover: rgba(0, 0, 0, 0.05);
    --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --radius: 8px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --surface-0: #141413;
      --surface-1: #1f1f1d;
      --text-primary: #ededea;
      --text-secondary: #9c9b95;
      --border-strong: rgba(255, 255, 255, 0.25);
      --hover: rgba(255, 255, 255, 0.07);
    }
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    background: var(--surface-0);
    color: var(--text-primary);
    font-family: var(--font-sans);
  }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }
  .game { width: 100%; max-width: 400px; }
  .hud {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin: 0 0 8px;
  }
  .label { font-size: 13px; color: var(--text-secondary); }
  .score { font-size: 24px; font-weight: 500; margin-left: 8px; }
  .best { font-weight: 500; color: var(--text-primary); }
  .stage {
    position: relative;
    width: 100%;
    background: var(--surface-1);
    border-radius: 12px;
    overflow: hidden;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  canvas { display: block; width: 100%; height: 460px; }
  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
    text-align: center;
    padding: 0 24px;
  }
  .overlay h1 { font-size: 18px; font-weight: 500; margin: 0; }
  .overlay p { font-size: 14px; color: var(--text-secondary); margin: 0; line-height: 1.5; }
  button {
    margin-top: 12px;
    font: inherit;
    font-size: 14px;
    color: var(--text-primary);
    background: transparent;
    border: 0.5px solid var(--border-strong);
    border-radius: var(--radius);
    padding: 8px 16px;
    cursor: pointer;
  }
  button:hover { background: var(--hover); }
  button:active { transform: scale(0.98); }
</style>
</head>
<body>
<div class="game">
  <div class="hud">
    <div><span class="label">Score</span><span class="score" id="score">0</span></div>
    <div class="label">Best <span class="best" id="best">0</span></div>
  </div>
  <div class="stage" id="stage">
    <canvas id="canvas"></canvas>
    <div class="overlay" id="overlay">
      <h1 id="title">Stack</h1>
      <p id="subtitle">Tap to drop the sliding block. Line it up to build higher.</p>
      <button id="button">Play</button>
    </div>
  </div>
</div>

<script>
(function () {
  const stage = document.getElementById('stage');
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const overlay = document.getElementById('overlay');
  const titleEl = document.getElementById('title');
  const subtitleEl = document.getElementById('subtitle');
  const button = document.getElementById('button');

  // Tuning
  const BLOCK_H = 26;      // block height in world pixels
  const PERFECT_TOL = 6;   // horizontal slack (px) that still counts as a perfect drop
  const BASE_SPEED = 150;  // px/s for the first block
  const SPEED_STEP = 11;   // added per block placed
  const MAX_SPEED = 380;
  const PALETTE = ['#7F77DD', '#1D9E75', '#D85A30', '#D4537E', '#378ADD', '#EF9F27'];

  let W = 360, H = 460, dpr = 1;
  let state = 'idle';               // idle | playing | over
  let blocks = [];                  // placed blocks, bottom to top: { x, w, c }
  let mover = null;                 // the sliding block: { x, w, c }
  let dir = 1, speed = 0;
  let score = 0, best = 0, streak = 0;
  let cam = -50, camTarget = -50;   // world y that maps to the bottom edge of the canvas
  let zoom = 1, zoomTarget = 1;     // zooms out on game over to show the whole tower
  let debris = [], effects = [];
  let baseW = 0, shake = 0, lastT = 0;
  let textColor = [30, 30, 30];
  let font = 'system-ui, sans-serif';

  // Colors
  function hexToRgb(h) {
    return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
  }
  function parseRgb(s) {
    const m = (s || '').match(/[\d.]+/g);
    return m && m.length >= 3 ? [+m[0], +m[1], +m[2]] : [30, 30, 30];
  }
  function rgba(c, a = 1, darken = 1) {
    return `rgba(${Math.round(c[0] * darken)},${Math.round(c[1] * darken)},${Math.round(c[2] * darken)},${a})`;
  }
  // Drifts smoothly through the palette, one color every 8 blocks
  function colorAt(i) {
    const seg = 8;
    const k = Math.floor(i / seg) % PALETTE.length;
    const t = (i % seg) / seg;
    const a = hexToRgb(PALETTE[k]);
    const b = hexToRgb(PALETTE[(k + 1) % PALETTE.length]);
    return [0, 1, 2].map(j => Math.round(a[j] + (b[j] - a[j]) * t));
  }

  // Setup
  function resize() {
    W = stage.clientWidth || 360;
    H = Math.max(380, Math.min(560, Math.round(W * 1.3)));
    dpr = window.devicePixelRatio || 1;
    canvas.style.height = H + 'px';
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    textColor = parseRgb(getComputedStyle(scoreEl).color);
    font = getComputedStyle(document.documentElement).getPropertyValue('--font-sans').trim() || font;
  }

  function updateHud() {
    if (score > best) best = score;
    scoreEl.textContent = score;
    bestEl.textContent = best;
  }

  function reset() {
    baseW = Math.round(W * 0.6);
    blocks = [{ x: (W - baseW) / 2, w: baseW, c: colorAt(0) }];
    score = 0; streak = 0;
    debris = []; effects = [];
    cam = -50; camTarget = -50;
    zoom = 1; zoomTarget = 1;
    shake = 0;
    spawn();
    updateHud();
  }

  // New sliding block on top of the tower, entering from alternating sides
  function spawn() {
    const n = blocks.length;
    const top = blocks[n - 1];
    dir = n % 2 === 0 ? 1 : -1;
    speed = Math.min(BASE_SPEED + n * SPEED_STEP, MAX_SPEED);
    mover = { x: dir === 1 ? -top.w / 2 : W - top.w / 2, w: top.w, c: colorAt(n) };
  }

  function piece(x, level, w, c, side) {
    return { x, y: level * BLOCK_H, w, c, vy: 20, vx: side * 40, rot: 0, vr: side * 2.2, a: 1 };
  }

  function start() {
    reset();
    state = 'playing';
    overlay.style.display = 'none';
  }

  function gameOver() {
    state = 'over';
    shake = 8;
    const towerH = blocks.length * BLOCK_H;
    zoomTarget = Math.min(1, (H - 100) / towerH);
    camTarget = -50 / zoomTarget;
    updateHud();
    setTimeout(() => {
      const n = blocks.length - 1;
      titleEl.textContent = 'Game over';
      subtitleEl.textContent = `You stacked ${n} ${n === 1 ? 'block' : 'blocks'}. Score ${score}.`;
      button.textContent = 'Play again';
      overlay.style.display = 'flex';
    }, 700);
  }

  function drop() {
    const n = blocks.length;
    const top = blocks[n - 1];
    const d = mover.x - top.x;

    if (Math.abs(d) <= PERFECT_TOL) {
      // Perfect: snap into place, and from the second perfect in a row grow the block back out
      streak++;
      const w = Math.min(top.w + (streak >= 2 ? 6 : 0), baseW);
      const x = top.x + (top.w - w) / 2;
      blocks.push({ x, w, c: mover.c });
      score += 2;
      effects.push({ t: 0, x, y: n * BLOCK_H, w, label: streak >= 2 ? `Perfect x${streak}` : 'Perfect' });
    } else {
      streak = 0;
      const overlap = top.w - Math.abs(d);
      if (overlap <= 0) {
        debris.push(piece(mover.x, n, mover.w, mover.c, d > 0 ? 1 : -1));
        gameOver();
        return;
      }
      // Keep the overlapping part, let the overhang fall
      const cutX = d > 0 ? top.x + top.w : mover.x;
      blocks.push({ x: d > 0 ? mover.x : top.x, w: overlap, c: mover.c });
      debris.push(piece(cutX, n, Math.abs(d), mover.c, d > 0 ? 1 : -1));
      score += 1;
    }

    updateHud();
    camTarget = Math.max(-50, blocks.length * BLOCK_H - H * 0.55);
    spawn();
  }

  // World to screen. World y points up, with 0 at the base of the tower.
  function sx(x) { return W / 2 + (x - W / 2) * zoom; }
  function sy(y) { return H - (y - cam) * zoom; }

  function drawBlock(x, y, w, c, a) {
    const X = sx(x), Y = sy(y + BLOCK_H), Wd = w * zoom, Hd = BLOCK_H * zoom;
    const edge = Math.max(2, 4 * zoom);
    ctx.fillStyle = rgba(c, a);
    ctx.fillRect(X, Y, Wd, Hd);
    ctx.fillStyle = rgba(c, a, 0.78);
    ctx.fillRect(X, Y + Hd - edge, Wd, edge);
  }

  function draw() {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, W, H);
    if (shake > 0) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);

    blocks.forEach((b, i) => drawBlock(b.x, i * BLOCK_H, b.w, b.c, 1));
    if (state === 'playing') drawBlock(mover.x, blocks.length * BLOCK_H, mover.w, mover.c, 1);

    for (const d of debris) {
      ctx.save();
      ctx.translate(sx(d.x + d.w / 2), sy(d.y + BLOCK_H / 2));
      ctx.rotate(d.rot);
      ctx.fillStyle = rgba(d.c, Math.max(0, d.a));
      ctx.fillRect(-d.w * zoom / 2, -BLOCK_H * zoom / 2, d.w * zoom, BLOCK_H * zoom);
      ctx.restore();
    }

    for (const f of effects) {
      const p = f.t / 0.6, a = Math.max(0, 1 - p), pad = p * 14;
      ctx.strokeStyle = rgba(textColor, a);
      ctx.lineWidth = 2;
      ctx.strokeRect(sx(f.x) - pad, sy(f.y + BLOCK_H) - pad, f.w * zoom + pad * 2, BLOCK_H * zoom + pad * 2);
      ctx.fillStyle = rgba(textColor, a);
      ctx.font = '500 14px ' + font;
      ctx.textAlign = 'center';
      ctx.fillText(f.label, sx(f.x + f.w / 2), sy(f.y + BLOCK_H) - 12 - p * 18);
    }
  }

  function frame(t) {
    const dt = Math.min(0.05, (t - lastT) / 1000) || 0;
    lastT = t;

    if (state === 'playing') {
      mover.x += dir * speed * dt;
      if (mover.x < -mover.w / 2) { mover.x = -mover.w / 2; dir = 1; }
      if (mover.x > W - mover.w / 2) { mover.x = W - mover.w / 2; dir = -1; }
    }

    cam += (camTarget - cam) * Math.min(1, dt * 6);
    zoom += (zoomTarget - zoom) * Math.min(1, dt * 4);
    if (shake > 0) { shake *= Math.exp(-6 * dt); if (shake < 0.3) shake = 0; }

    for (let i = debris.length - 1; i >= 0; i--) {
      const d = debris[i];
      d.vy -= 1500 * dt;
      d.y += d.vy * dt;
      d.x += d.vx * dt;
      d.rot += d.vr * dt;
      d.a -= 0.5 * dt;
      if (d.a <= 0 || sy(d.y) > H + 80) debris.splice(i, 1);
    }
    for (let i = effects.length - 1; i >= 0; i--) {
      effects[i].t += dt;
      if (effects[i].t > 0.6) effects.splice(i, 1);
    }

    draw();
    requestAnimationFrame(frame);
  }

  // Input
  overlay.addEventListener('pointerdown', e => { e.preventDefault(); start(); });
  canvas.addEventListener('pointerdown', e => { e.preventDefault(); if (state === 'playing') drop(); });
  window.addEventListener('keydown', e => {
    if (e.code !== 'Space' && e.code !== 'Enter') return;
    e.preventDefault();
    if (state === 'playing') drop();
    else if (state === 'idle') start();
  });
  window.addEventListener('resize', () => { resize(); if (state !== 'playing') reset(); });

  resize();
  reset();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
